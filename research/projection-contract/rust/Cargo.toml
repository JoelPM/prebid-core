[package]
name = "projprobe"
version = "0.0.0"
edition = "2021"
publish = false

# Trusted Server's OpenRTB model, from the sibling checkout. Same serde_json features as Trusted Server
# (default + std: no preserve_order, no arbitrary_precision; `cargo tree -e features -i serde_json`).
[dependencies]
trusted-server-openrtb = { path = "../../../../trusted-server/crates/trusted-server-openrtb" }
serde_json = "=1.0.150"
base64 = "0.22"

