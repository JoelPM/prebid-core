[package]
name = "miniserde_floor"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
miniserde = "0.1"

[features]
# derive: parse into typed structs (what an author would want) instead of json::Value
derive = []

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
