[package]
name = "guest_typed1"
version = "0.1.0"
edition = "2021"
description = "PROTOTYPE: Rust generated by the typed back end (gen/rs-typed1, Level 1) behind the same Host ABI as guest/ and typed-ref/"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["openx", "pubmatic"]
openx = []
pubmatic = []
# runtime option: per-call bump allocator (allocations die with the call) instead of dlmalloc
bump = []

[dependencies]
prebid_core_rt2 = { path = "../runtime/rt2" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
